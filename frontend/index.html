<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Unlock Surprise 🔒</title>
        <link

            rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
        <style>
        /* Centers the box perfectly on this page */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    </style>
    </head>
    <body>

        <div id="petals"></div>

        <div
            style="background: var(--card-bg); padding: 3rem 2rem; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); max-width: 500px; width: 100%; text-align: center; z-index: 10;">
            <h2
                style="font-family: var(--font-display); color: var(--rose); margin-bottom: 1rem; font-size: 2.5rem;">Wait
                a minute... 🛑</h2>
            <p style="margin-bottom: 2rem; color: rgba(255,245,238,0.8);">Before
                you can see your surprise, answer these to prove it's you!</p>

            <div style="margin-bottom: 1.5rem; text-align: left;">
                <label
                    style="display: block; margin-bottom: 0.5rem; color: var(--gold); font-weight: 600;">1.
                    What is the one food you can never say no to?</label>
                <input type="text" id="q1" class="form-input"
                    style="width: 100%;" placeholder="Enter answer...">
            </div>

            <div style="margin-bottom: 2rem; text-align: left;">
                <label
                    style="display: block; margin-bottom: 0.5rem; color: var(--gold); font-weight: 600;">2.
                    Who takes way longer to reply to texts?</label>
                <input type="text" id="q2" class="form-input"
                    style="width: 100%;" placeholder="Enter 'me' or 'you'...">
            </div>

            <p id="quiz-error"
                style="color: #ff4757; font-size: 0.95rem; margin-bottom: 1rem; display: none; font-weight: 600;">Please
                fill out both answers! 😂</p>

            <button class="cta-btn" id="unlock-btn" onclick="submitQuiz()"
                style="margin-top: 0;">Unlock Surprise 🔓</button>
        </div>

        <script>
        // Simple falling petals for the login page
        function createPetals() {
            const container = document.getElementById('petals');
            const colors = ['#e8638a','#f5c842','#fce4ec','#c2185b','#ff8fab'];
            for (let i = 0; i < 15; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                petal.style.cssText = `left: ${Math.random() * 100}%; width: ${6 + Math.random() * 10}px; height: ${6 + Math.random() * 10}px; background: ${colors[Math.floor(Math.random() * colors.length)]}; animation-duration: ${4 + Math.random() * 6}s; animation-delay: ${-Math.random() * 8}s;`;
                container.appendChild(petal);
            }
        }
        createPetals();

        // Send to backend and redirect
       async function submitQuiz() {
    const answer1 = document.getElementById('q1').value.trim();
    const answer2 = document.getElementById('q2').value.trim();
    const errorText = document.getElementById('quiz-error');
    const btn = document.getElementById('unlock-btn');

    if (!answer1 || !answer2) {
        errorText.style.display = 'block';
        errorText.textContent = "Please fill out both answers! 😂";
        return; 
    }

    errorText.style.display = 'none';
    btn.textContent = "Saving...";
    btn.disabled = true;

    try {
        const response = await fetch('https://birthday-six-sepia-31.vercel.app/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                foodAnswer: answer1,
                replyAnswer: answer2
            })
        });

        const data = await response.json();
        console.log("Response:", data);

        if (response.ok) {
            // ✅ Only redirect if actually saved!
            window.location.href = "main.html";
        } else {
            // ❌ Block if failed
            errorText.style.display = 'block';
            errorText.textContent = "Could not save! Try again. ❌";
            btn.textContent = "Unlock Surprise 🔓";
            btn.disabled = false;
        }
    } catch (error) {
        console.error("Error:", error);
        // ❌ Block if server unreachable
        errorText.style.display = 'block';
        errorText.textContent = "Server not reachable! Try again. ❌";
        btn.textContent = "Unlock Surprise 🔓";
        btn.disabled = false;
    }
}
